# Teacher steps 1-7: start with the existing Lab3 image and the request sender.
name: lab4_car_price

services:
  ml_service:
    image: car_price_prediction:1

    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  requests:
    build: ./requests
    image: car_price_requests:2

    environment:
      ML_SERVICE_URL: http://ml_service:8000/api/prediction
    depends_on:
      ml_service:
        condition: service_healthy
